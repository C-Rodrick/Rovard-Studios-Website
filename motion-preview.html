<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rovard Motion — Animation System Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #0C0CB4;
      --brand-deep: #0507B0;
      --gold: #FDCF09;
      --paper: #F7F7F5;
      --ink: #101014;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }
    h1, h2, h3, .display { font-family: 'Syne', sans-serif; }

    /* ── Demo chrome ── */
    .demo-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 5vw;
      background: rgba(247, 247, 245, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(16, 16, 20, 0.08);
      transition: transform .5s cubic-bezier(.22,1,.36,1);
    }
    .demo-nav.is-hidden { transform: translateY(-100%); }
    .demo-nav .logo { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: .12em; font-size: 15px; color: var(--brand); }
    .demo-nav .routes { display: flex; gap: 10px; }
    .demo-nav .routes button {
      border: 1px solid rgba(16,16,20,.15); background: transparent; color: var(--ink);
      font: 600 11px 'Inter', sans-serif; letter-spacing: .14em; text-transform: uppercase;
      padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: all .3s;
    }
    .demo-nav .routes button.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* ── Hero ── */
    .hero {
      position: relative; min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; padding: 120px 7vw 80px; overflow: hidden;
      background: linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 70%);
      color: #fff;
    }
    .hero-blob {
      position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; pointer-events: none;
    }
    .hero-blob.one { width: 480px; height: 480px; right: -120px; top: -80px; background: #3D3DF0; }
    .hero-blob.two { width: 380px; height: 380px; left: -100px; bottom: -60px; background: var(--gold); opacity: .28; }
    .hero-kicker {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 11px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--gold);
      margin-bottom: 28px;
    }
    .hero-kicker::before { content: ""; width: 34px; height: 2px; background: var(--gold); }
    .hero h1 {
      font-size: clamp(2.6rem, 7vw, 5.6rem); line-height: 1.02; letter-spacing: -0.02em; max-width: 14ch;
    }
    .hero p { margin-top: 26px; max-width: 46ch; color: rgba(255,255,255,.75); font-size: 1.05rem; line-height: 1.7; }
    .hero-actions { margin-top: 44px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .btn-primary {
      display: inline-block; background: var(--gold); color: var(--ink); border: 0;
      font: 700 12px 'Inter', sans-serif; letter-spacing: .16em; text-transform: uppercase;
      padding: 18px 34px; border-radius: 999px; cursor: pointer;
    }
    .btn-ghost {
      display: inline-block; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35);
      font: 600 12px 'Inter', sans-serif; letter-spacing: .16em; text-transform: uppercase;
      padding: 17px 30px; border-radius: 999px; cursor: pointer; transition: border-color .3s;
    }
    .btn-ghost:hover { border-color: #fff; }

    /* ── Marquee ── */
    .marquee-strip {
      background: var(--ink); color: var(--paper); padding: 26px 0;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: clamp(1.2rem, 3vw, 2rem);
    }
    .marquee-strip .m-item { display: flex; align-items: center; gap: 34px; padding-right: 34px; white-space: nowrap; }
    .marquee-strip .m-item em { color: var(--gold); font-style: normal; font-size: .6em; }

    /* ── Sections ── */
    .section { padding: 120px 7vw; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-bottom: 60px; flex-wrap: wrap; }
    .section-head h2 { font-size: clamp(2rem, 4.5vw, 3.4rem); letter-spacing: -0.02em; }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--brand); margin-bottom: 14px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
    .stat {
      background: #fff; border-radius: 22px; padding: 38px 30px;
      box-shadow: 0 4px 24px rgba(10, 10, 20, .06);
    }
    .stat .num { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(2.2rem, 4vw, 3.2rem); color: var(--brand); }
    .stat .lbl { margin-top: 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(16,16,20,.55); }

    /* ── Work grid ── */
    .work-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
    .work-card {
      border-radius: 24px; overflow: hidden; background: #fff; text-align: left; border: 0; cursor: pointer;
      box-shadow: 0 6px 30px rgba(10, 10, 20, .08); display: block; width: 100%;
      font-family: inherit;
    }
    .work-card .thumb { height: 240px; position: relative; overflow: hidden; }
    .work-card .thumb i {
      position: absolute; inset: 0; display: block;
    }
    .work-card .body { padding: 26px 26px 30px; }
    .work-card .tag { font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--brand); }
    .work-card h3 { margin-top: 10px; font-size: 1.35rem; }
    .work-card p { margin-top: 10px; font-size: .92rem; line-height: 1.6; color: rgba(16,16,20,.6); }

    /* ── CTA footer ── */
    .cta {
      background: var(--ink); color: var(--paper); text-align: center; padding: 140px 7vw;
    }
    .cta h2 { font-size: clamp(2.4rem, 6vw, 4.6rem); letter-spacing: -0.02em; max-width: 16ch; margin: 0 auto; }
    .cta .btn-primary { margin-top: 46px; }

    .page-pad { padding-top: 76px; }
    .placeholder-page { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 0 7vw; }
  </style>
</head>
<body>
  <div id="demo-root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <script type="text/plain" id="demo-source">
    const {
      MotionProvider, Reveal, Stagger, StaggerItem, TextReveal, Parallax, Magnetic,
      Tilt, Marquee, CountUp, ScrollProgress, Cursor, PageTransition, IntroOverlay,
      useScrollDirection,
    } = window.RovardMotion;

    const THUMBS = {
      blue: 'linear-gradient(135deg, #0C0CB4, #3D3DF0 70%)',
      gold: 'linear-gradient(135deg, #FDCF09, #f59e0b)',
      ink: 'linear-gradient(135deg, #101014, #2b2b34)',
      green: 'linear-gradient(135deg, #1B4839, #5CAD8D)',
      violet: 'linear-gradient(135deg, #21003F, #6B2FB3)',
      rose: 'linear-gradient(135deg, #8E0E4F, #E84A5F)',
    };

    const WORK = [
      { title: 'PDOCA', tag: 'Social Media', copy: 'A bold campaign identity for a coaching academy.', thumb: 'blue' },
      { title: 'LinkRithm', tag: 'Brand Identity', copy: 'A connected system for engineering teams.', thumb: 'violet' },
      { title: 'ShorteeMe', tag: 'Social Media', copy: 'Financing made clear, human and shareable.', thumb: 'gold' },
      { title: 'Bitefort', tag: 'Brand Identity', copy: 'Privacy and compliance, made approachable.', thumb: 'rose' },
      { title: 'Green Blueprint', tag: 'Brand Identity', copy: 'Sustainable urban design, visualised.', thumb: 'green' },
      { title: 'Kymela 2026', tag: 'Social Media', copy: 'Content with tempo and recognition.', thumb: 'ink' },
    ];

    function Nav({ route, setRoute, hidden }) {
      const routes = ['home', 'work', 'studio'];
      return (
        <nav className={'demo-nav' + (hidden ? ' is-hidden' : '')}>
          <span className="logo">ROVARD — MOTION</span>
          <div className="routes">
            {routes.map(r => (
              <button
                key={r}
                className={route === r ? 'active' : ''}
                data-cursor
                onClick={() => setRoute(r)}
              >{r}</button>
            ))}
          </div>
        </nav>
      );
    }

    function Hero() {
      return (
        <header className="hero">
          <Parallax speed={0.22} className="hero-blob one" style={{ position: 'absolute' }} />
          <Parallax speed={-0.16} className="hero-blob two" style={{ position: 'absolute' }} />
          <Reveal variant="fade" duration={800}>
            <span className="hero-kicker">Rovard Studios — Motion System</span>
          </Reveal>
          <TextReveal as="h1" text="We design brands that move with intent." by="word" step={60} />
          <Reveal variant="rise" delay={650}>
            <p>One React file. Scroll reveals, masked headlines, magnetic buttons, 3D tilt cards, panel-wipe transitions and a designer cursor — all tuned to Rovard's brand energy.</p>
          </Reveal>
          <Reveal variant="rise" delay={850}>
            <div className="hero-actions">
              <Magnetic strength={0.4}>
                <button className="btn-primary" data-cursor>Start a project ↗</button>
              </Magnetic>
              <Magnetic strength={0.25}>
                <button className="btn-ghost" data-cursor>See the work</button>
              </Magnetic>
            </div>
          </Reveal>
        </header>
      );
    }

    function Ticker() {
      const items = ['Brand Identity', 'Social Media', 'Motion Design', 'Art Direction', 'UI Design', 'Packaging'];
      return (
        <Marquee speed={24}>
          {items.map((t, i) => (
            <span className="m-item" key={i}>{t} <em>✦</em></span>
          ))}
        </Marquee>
      );
    }

    function Stats() {
      return (
        <section className="section">
          <Stagger>
            <div className="stats">
              <StaggerItem variant="rise"><div className="stat"><div className="num"><CountUp to={64} suffix="+" /></div><div className="lbl">Projects shipped</div></div></StaggerItem>
              <StaggerItem variant="rise"><div className="stat"><div className="num"><CountUp to={98} suffix="%" /></div><div className="lbl">Client retention</div></div></StaggerItem>
              <StaggerItem variant="rise"><div className="stat"><div className="num"><CountUp to={12} /></div><div className="lbl">Brand systems</div></div></StaggerItem>
              <StaggerItem variant="rise"><div className="stat"><div className="num"><CountUp to={7} suffix=" yrs" /></div><div className="lbl">Design practice</div></div></StaggerItem>
            </div>
          </Stagger>
        </section>
      );
    }

    function Work() {
      return (
        <section className="section" style={{ paddingTop: 40 }}>
          <div className="section-head">
            <div>
              <Reveal variant="fade"><div className="kicker">Selected Work</div></Reveal>
              <TextReveal as="h2" text="Cards that tilt, follow and respond." by="word" step={40} />
            </div>
            <Reveal variant="from-right"><p style={{ maxWidth: '34ch', color: 'rgba(16,16,20,.6)', lineHeight: 1.7 }}>Hover any card — 3D tilt with light glare, plus a cursor that grows and speaks.</p></Reveal>
          </div>
          <Stagger step={70}>
            <div className="work-grid">
              {WORK.map((w, i) => (
                <StaggerItem key={w.title} variant="zoom">
                  <Tilt max={8}>
                    <button className="work-card" data-cursor-label="View case study">
                      <span className="thumb"><i style={{ background: THUMBS[w.thumb] }} /></span>
                      <span className="body">
                        <span className="tag">{w.tag}</span>
                        <h3>{w.title}</h3>
                        <p>{w.copy}</p>
                      </span>
                    </button>
                  </Tilt>
                </StaggerItem>
              ))}
            </div>
          </Stagger>
        </section>
      );
    }

    function CTA() {
      return (
        <section className="cta">
          <TextReveal as="h2" text="Ready to give your brand this kind of energy?" by="word" step={55} />
          <Reveal variant="rise" delay={500}>
            <Magnetic strength={0.45}>
              <button className="btn-primary" data-cursor>Start a project ↗</button>
            </Magnetic>
          </Reveal>
        </section>
      );
    }

    function FakePage({ route }) {
      if (route === 'work') {
        return (
          <div className="placeholder-page page-pad">
            <div className="kicker">Work Index</div>
            <TextReveal as="h2" text="Every panel wipe is a scene change." by="word" step={50} />
            <Reveal variant="rise" delay={500}><p style={{ marginTop: 20, color: 'rgba(16,16,20,.6)' }}>Use the nav buttons above to trigger the curtain transition between pages.</p></Reveal>
          </div>
        );
      }
      if (route === 'studio') {
        return (
          <div className="placeholder-page page-pad">
            <div className="kicker">Studio</div>
            <TextReveal as="h2" text="Motion with discipline, never noise." by="word" step={50} />
            <Reveal variant="rise" delay={500}><p style={{ marginTop: 20, color: 'rgba(16,16,20,.6)' }}>Every effect above respects prefers-reduced-motion and degrades gracefully.</p></Reveal>
          </div>
        );
      }
      return null;
    }

    function App() {
      const [route, setRoute] = useState('home');
      const direction = useScrollDirection();
      return (
        <MotionProvider>
          <IntroOverlay logo="ROVARD" duration={2000} once={false} />
          <ScrollProgress color="var(--brand)" />
          <Cursor hideNative />
          <Nav route={route} setRoute={setRoute} hidden={direction === 'down'} />
          <PageTransition transitionKey={route} panels={6}>
            {route === 'home' ? (
              <main>
                <Hero />
                <Ticker />
                <Stats />
                <Work />
                <CTA />
              </main>
            ) : (
              <FakePage route={route} />
            )}
          </PageTransition>
        </MotionProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('demo-root')).render(<App />);
  </script>

  <script>
    function boot() {
      function run(src) {
        var lib = src.replace(/import[\s\S]*?from\s*['"]react['"];?/, '');
        var shim = 'const { createContext, useContext, useState, useEffect, useRef, useMemo, useCallback } = React;\n';
        window.RovardMotion = new Function('React', shim + lib + '\n;return RovardMotionExports;')(React);
        var demo = document.getElementById('demo-source').textContent;
        var code = Babel.transform(demo, { presets: ['react'] }).code;
        new Function('React', 'ReactDOM', code)(React, ReactDOM);
      }
      function fail(err) {
        document.getElementById('demo-root').innerHTML =
          '<pre style="color:#b91c1c;padding:40px;font-family:monospace">' + err + '</pre>';
      }
      fetch('./RovardMotion.jsx')
        .then(function (r) { return r.text(); })
        .then(function (src) {
          if (typeof Babel === 'undefined') throw new Error('Babel failed to load — check your internet connection.');
          run(src);
        })
        .catch(fail);
    }
    // Wait for the full load event so React and Babel are definitely available.
    window.addEventListener('load', boot);
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
