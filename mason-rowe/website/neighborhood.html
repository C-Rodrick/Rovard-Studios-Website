<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neighborhood — Mason &amp; Rowe (concept)</title>
<meta name="description" content="Illustrative neighborhood maps and places for the four fictional Mason &amp; Rowe developments.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1B19">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script>try{if(sessionStorage.getItem('mr-nav')){document.documentElement.classList.add('mr-enter');sessionStorage.removeItem('mr-nav')}}catch(e){}</script>
<noscript><style>[data-r]{opacity:1!important;transform:none!important}[data-mask]>img,[data-mask-x]>img{clip-path:none!important;transform:none!important}.split .w>span{transform:none!important}</style></noscript>
</head>
<body data-page="neighborhood" data-hdr="solid">
<main id="main">

  <section class="page-top" style="padding-bottom:clamp(36px,4vw,64px)">
    <div class="wrap">
      <p class="eyebrow" data-r>Neighborhood</p>
      <h1 class="d-xl" data-split style="margin:22px 0 0;max-width:14ch">The <em>places</em> around.</h1>
    </div>
  </section>

  <section style="padding-bottom:clamp(36px,4vw,64px)">
    <div class="wrap"><div class="tabs" id="cityTabs" role="tablist" aria-label="Choose a city"></div></div>
  </section>

  <section class="sec--tight" style="padding-block:clamp(20px,3vw,40px) clamp(56px,7vw,110px)">
    <div class="wrap grid" style="row-gap:40px;align-items:center">
      <div style="grid-column:1 / span 5"><div id="hoodHead"></div><div id="hoodStory" style="margin-top:28px;max-width:46ch" class="mute"></div></div>
      <div style="grid-column:7 / span 6"><div class="img" id="hoodImg" style="aspect-ratio:16/10"></div></div>
    </div>
  </section>

  <section class="sec--tight" style="padding-block:0 clamp(28px,3vw,48px)">
    <div class="wrap"><dl class="facts facts--lg" id="hoodFacts" style="margin:0"></dl></div>
  </section>

  <section class="sec" style="padding-top:clamp(40px,5vw,72px)">
    <div class="wrap"><div id="hoodMap"></div></div>
  </section>

  <section class="sec sec--dark sec--tight">
    <div class="wrap grid" style="row-gap:30px;align-items:end">
      <div style="grid-column:1 / span 7"><h2 class="d-m">Walk it <em>for yourself.</em></h2><p class="lead" style="color:var(--stone);margin-top:16px">Every private viewing includes a guided walk of the neighborhood with your advisor.</p></div>
      <div style="grid-column:9 / span 4"><a class="btn btn--light btn--solid" href="private-viewing.html">Schedule a private viewing <svg class="ic"><use href="#i-arrow"/></svg></a></div>
    </div>
  </section>

</main>
<script src="../brand/mark.js"></script>
<script src="js/data.js"></script>
<script src="js/plans.js"></script>
<script src="js/site.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
